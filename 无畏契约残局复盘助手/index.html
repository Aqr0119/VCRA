<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VALORANT AI 教练 · 残局复盘</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:   "#0F1923",
          panel: "#1B2A38",
          line:  "#2A3B4A",
          red:   "#FF4655",
          teal:  "#00E0C7",
        },
        fontFamily: { display: ['"Arial Black"', 'Impact', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { background:#0F1923; }
  .clip-corner { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
  .sev-high { background:rgba(255,70,85,.15); color:#FF4655; border-color:#FF4655; }
  .sev-mid  { background:rgba(255,180,0,.15); color:#FFB400; border-color:#FFB400; }
  .sev-low  { background:rgba(0,224,199,.12); color:#00E0C7; border-color:#00E0C7; }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<div class="max-w-3xl mx-auto px-5 py-8">

  <!-- 标题 -->
  <header class="mb-8">
    <div class="flex items-center gap-3">
      <div class="w-2 h-9 bg-red"></div>
      <h1 class="font-display text-3xl md:text-4xl tracking-tight text-white">VALORANT AI 教练</h1>
    </div>
    <p class="text-slate-400 mt-3 text-sm leading-relaxed">
      上传一段残局录像，AI 先客观还原过程，再指出你的不足。非商业二创 · 仅供学习交流。
    </p>
  </header>

  <!-- 模式切换 -->
  <div class="flex items-center gap-2 mb-5 text-sm">
    <span class="text-slate-400">运行模式：</span>
    <button id="modeDemo" class="px-3 py-1.5 rounded clip-corner border border-teal text-teal">演示模式</button>
    <button id="modeReal" class="px-3 py-1.5 rounded clip-corner border border-line text-slate-400">真实模式</button>
    <span class="text-slate-500 text-xs ml-auto">演示模式无需联网与 API，答辩兜底用</span>
  </div>

  <!-- 真实模式：后端地址 -->
  <div id="backendBox" class="hidden mb-5">
    <label class="block text-xs text-slate-400 mb-1">后端地址</label>
    <input id="backendUrl" value="http://localhost:8000"
      class="w-full bg-panel border border-line rounded px-3 py-2 text-sm outline-none focus:border-teal" />
  </div>

  <!-- 上传区 -->
  <div id="dropzone"
    class="clip-corner border-2 border-dashed border-line bg-panel/60 rounded-lg p-8 text-center cursor-pointer hover:border-teal transition mb-5">
    <div class="text-4xl mb-2">🎯</div>
    <p class="text-slate-300 text-sm">点击选择 或 拖拽上传残局视频</p>
    <p class="text-slate-500 text-xs mt-1">建议 30 秒 – 2 分钟的片段（.mp4 / .mov / .webm）</p>
    <p id="fileName" class="text-teal text-xs mt-3"></p>
    <input id="fileInput" type="file" accept="video/*" class="hidden" />
  </div>

  <!-- 结构化信息 -->
  <div class="grid md:grid-cols-3 gap-4 mb-5">
    <div class="md:col-span-1">
      <label class="block text-xs text-slate-400 mb-1">地图</label>
      <select id="mapName" class="w-full bg-panel border border-line rounded px-3 py-2 text-sm outline-none focus:border-teal">
        <option value="">选择地图</option>
        <option>亚海悬城 Ascent</option>
        <option>源工重镇 Bind</option>
        <option>隐世修所 Haven</option>
        <option>霓虹町 Split</option>
        <option>森寒冬港 Icebox</option>
        <option>微风岛屿 Breeze</option>
        <option>深海明珠 Pearl</option>
        <option>莲华古城 Lotus</option>
        <option>幽邃地窟 Sunset</option>
        <option>其他</option>
      </select>
    </div>
    <div class="md:col-span-1">
      <label class="block text-xs text-slate-400 mb-1">你的特工</label>
      <input id="agent" placeholder="例如：捷风 / Jett"
        class="w-full bg-panel border border-line rounded px-3 py-2 text-sm outline-none focus:border-teal" />
    </div>
    <div class="md:col-span-2 md:col-start-2">
      <label class="block text-xs text-slate-400 mb-1">残局开始时的情况（填得越细，复盘越准）</label>
      <textarea id="situation" rows="2" placeholder="例如：1v2，我 75 血，无治疗技能，敌方在 A 大方向，剩余 30 秒"
        class="w-full bg-panel border border-line rounded px-3 py-2 text-sm outline-none focus:border-teal resize-none"></textarea>
    </div>
  </div>

  <!-- 提交 -->
  <button id="submitBtn"
    class="w-full bg-red hover:brightness-110 active:brightness-95 text-white font-bold py-3 rounded clip-corner transition">
    开始复盘
  </button>
  <p id="status" class="text-center text-sm mt-3 min-h-[1.25rem]"></p>

  <!-- 结果卡 -->
  <section id="result" class="hidden mt-8">
    <div id="card" class="bg-panel border border-line rounded clip-corner p-6">

      <div class="flex items-center justify-between border-b border-line pb-4 mb-5">
        <div>
          <div class="text-xs text-slate-400 tracking-widest">残局复盘报告</div>
          <div id="cardMeta" class="text-sm text-slate-300 mt-1"></div>
        </div>
        <div class="text-right">
          <div id="cardScore" class="font-display text-4xl text-red leading-none">–</div>
          <div class="text-[11px] text-slate-500 mt-1">本局评分 / 10</div>
        </div>
      </div>

      <div class="mb-5">
        <div class="text-xs text-teal mb-1 tracking-widest">教练总评</div>
        <p id="cardSummary" class="text-slate-200 leading-relaxed"></p>
      </div>

      <div class="mb-5">
        <div class="text-xs text-teal mb-2 tracking-widest">关键失误</div>
        <div id="mistakeList" class="space-y-3"></div>
      </div>

      <div class="mb-5">
        <div class="text-xs text-teal mb-1 tracking-widest">值得肯定</div>
        <p id="cardGood" class="text-slate-300 text-sm"></p>
      </div>

      <div id="cardRecordWrap" class="mb-5 hidden">
        <button id="toggleRecord" class="text-xs text-slate-400 underline">查看 AI 的客观记录 ▾</button>
        <pre id="cardRecord" class="hidden mt-2 text-[11px] text-slate-500 bg-ink/60 rounded p-3 overflow-x-auto whitespace-pre-wrap"></pre>
      </div>

      <p id="cardDisclaimer" class="text-[11px] text-slate-500 border-t border-line pt-3"></p>
    </div>

    <button id="saveBtn"
      class="mt-4 w-full border border-teal text-teal hover:bg-teal/10 font-semibold py-2.5 rounded clip-corner transition">
      保存为图片
    </button>
  </section>

  <footer class="text-center text-xs text-slate-600 mt-10">
    OH 技术俱乐部 · Vibe Coding 作品 · 由 AI 驱动
  </footer>
</div>

<script>
// ---------------------------------------------------------------- 演示数据
const SAMPLE = {
  record: [
    { time: "0:00", event: "从 A 大方向平移，准星略低于头部高度", evidence: "画面右侧可见 A 大道入口", confidence: "高" },
    { time: "0:02", event: "遇到前方敌人后开镜射击", evidence: "屏幕中央出现敌人轮廓", confidence: "中" },
    { time: "0:05", event: "血量下降至 40，未使用治疗技能", evidence: "左下角血量 40，技能图标未点亮", confidence: "中" },
    { time: "0:08", event: "向后撤退时未重新架点，随后倒地", evidence: "画面从 A 大转向后方", confidence: "中" }
  ],
  review: {
    score: 6,
    level: "黄金",
    summary: "残局里你在血量劣势下既没补技能、也没重新架点，把本可稳住的 1v1 打成了被反打。",
    mistakes: [
      { time: "0:02", type: "准星位置", detail: "拉枪时准星低于头部高度，先手枪打在了胸口。", severity: "高", fix: "转角前把准星架在敌人可能出现的爆头线高度，出角即头部。" },
      { time: "0:08", type: "走位 / 架点", detail: "撤退时一路后退，没有停下来重新架枪。", severity: "高", fix: "后撤时找掩体停下重新架点，用信息换时间，别一路裸退。" },
      { time: "0:05", type: "技能管理", detail: "血量掉到 40、治疗技能可用但没用。", severity: "中", fix: "掉血过半且暂时脱战时优先补血，别等交火时才想起来。" }
    ],
    good: "开镜的反应速度不错，看到敌人时没有犹豫。",
    disclaimer: "AI 复盘仅供参考，具体以实际情况为准"
  }
};

// ---------------------------------------------------------------- 状态
let mode = "demo";
let selectedFile = null;

const $ = (id) => document.getElementById(id);

// 模式切换
function setMode(m) {
  mode = m;
  const on  = ["border-teal", "text-teal"];
  const off = ["border-line", "text-slate-400"];
  $("modeDemo").className = "px-3 py-1.5 rounded clip-corner border " + (m === "demo" ? on : off).join(" ");
  $("modeReal").className = "px-3 py-1.5 rounded clip-corner border " + (m === "real" ? on : off).join(" ");
  $("backendBox").classList.toggle("hidden", m !== "real");
}
$("modeDemo").onclick = () => setMode("demo");
$("modeReal").onclick = () => setMode("real");

// 上传
$("dropzone").onclick = () => $("fileInput").click();
$("dropzone").ondragover = (e) => { e.preventDefault(); $("dropzone").classList.add("border-teal"); };
$("dropzone").ondragleave = () => $("dropzone").classList.remove("border-teal");
$("dropzone").ondrop = (e) => {
  e.preventDefault();
  $("dropzone").classList.remove("border-teal");
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
};
$("fileInput").onchange = (e) => { if (e.target.files[0]) setFile(e.target.files[0]); };
function setFile(f) {
  selectedFile = f;
  $("fileName").textContent = "已选择：" + f.name + "（" + (f.size / 1048576).toFixed(1) + " MB）";
}

// 提交
$("submitBtn").onclick = async () => {
  const map   = $("mapName").value;
  const agent = $("agent").value.trim();
  $("status").className = "text-center text-sm mt-3 text-slate-400";
  $("status").textContent = "复盘中，请稍候…";

  try {
    let data;
    if (mode === "demo") {
      await new Promise((r) => setTimeout(r, 900));  // 模拟思考
      data = SAMPLE;
    } else {
      if (!selectedFile) { $("status").textContent = "请先上传一段视频"; $("status").className = "text-center text-sm mt-3 text-red"; return; }
      const fd = new FormData();
      fd.append("video", selectedFile);
      fd.append("map_name", map);
      fd.append("agent", agent);
      fd.append("situation", $("situation").value.trim());
      const res = await fetch($("backendUrl").value.replace(/\/$/, "") + "/api/review", { method: "POST", body: fd });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || ("请求失败 " + res.status));
      }
      data = await res.json();
    }
    render(data, map, agent);
    $("status").textContent = "复盘完成 ✓";
    $("status").className = "text-center text-sm mt-3 text-teal";
  } catch (e) {
    $("status").textContent = "出错了：" + e.message;
    $("status").className = "text-center text-sm mt-3 text-red";
  }
};

// 渲染
function sevClass(s) {
  if (s === "高") return "sev-high";
  if (s === "中") return "sev-mid";
  return "sev-low";
}

function render(data, map, agent) {
  const r = data.review || {};
  $("cardScore").textContent = r.score ?? "–";
  const bits = [];
  if (map) bits.push(map);
  if (agent) bits.push(agent);
  if (r.level) bits.push("评估段位 " + r.level);
  $("cardMeta").textContent = bits.join(" · ") || "未填写地图/特工";
  $("cardSummary").textContent = r.summary || "";
  $("cardGood").textContent = r.good || "暂无";

  const list = $("mistakeList");
  list.innerHTML = "";
  (r.mistakes || []).forEach((m) => {
    const div = document.createElement("div");
    div.className = "border border-line rounded p-3 bg-ink/40";
    div.innerHTML =
      '<div class="flex items-center gap-2 mb-1">' +
        '<span class="text-xs text-slate-500 font-mono">' + (m.time || "") + '</span>' +
        '<span class="text-sm font-semibold text-white">' + (m.type || "失误") + '</span>' +
        '<span class="ml-auto text-[10px] px-2 py-0.5 rounded-full border ' + sevClass(m.severity) + '">' + (m.severity || "") + '</span>' +
      '</div>' +
      '<p class="text-sm text-slate-300 mb-1">' + (m.detail || "") + '</p>' +
      '<p class="text-sm text-teal">改进：' + (m.fix || "") + '</p>';
    list.appendChild(div);
  });

  if (data.record) {
    $("cardRecordWrap").classList.remove("hidden");
    $("cardRecord").textContent = JSON.stringify(data.record, null, 2);
  } else {
    $("cardRecordWrap").classList.add("hidden");
  }

  $("cardDisclaimer").textContent = r.disclaimer || "AI 复盘仅供参考。";
  $("result").classList.remove("hidden");
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

// 折叠客观记录
$("toggleRecord").onclick = () => {
  const p = $("cardRecord");
  p.classList.toggle("hidden");
  $("toggleRecord").textContent = p.classList.contains("hidden") ? "查看 AI 的客观记录 ▾" : "收起记录 ▴";
};

// 保存图片
$("saveBtn").onclick = () => {
  html2canvas($("card"), { backgroundColor: "#1B2A38", scale: 2 }).then((canvas) => {
    const a = document.createElement("a");
    a.download = "valorant-review.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });
};

setMode("demo");
</script>
</body>
</html>
